name: Tests and coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests/unit --cov=custom_components.appliance_cycle_monitor --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.unit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests/component --cov=custom_components.appliance_cycle_monitor --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.component
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-component
          path: .coverage.component
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, component]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
      - uses: actions/download-artifact@v4
        with:
          name: coverage-component
          path: coverage/component
      - run: python -m coverage combine coverage/unit coverage/component
      - run: python -m coverage report --fail-under=95
