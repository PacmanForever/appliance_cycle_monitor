name: Daily Home Assistant compatibility

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily_compatibility:
    runs-on: ubuntu-latest
    outputs:
      tested_version: ${{ steps.home_assistant_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pip install --upgrade homeassistant pytest-homeassistant-custom-component
      - name: Capture tested Home Assistant version
        id: home_assistant_version
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')" >> "$GITHUB_OUTPUT"
      - run: python -m pytest -q tests/component

  publish-tested-version:
    if: github.ref == 'refs/heads/main'
    needs: daily_compatibility
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update tested version badge data
        env:
          TESTED_VERSION: ${{ needs.daily_compatibility.outputs.tested_version }}
        run: |
          python -c "import json, os; from pathlib import Path; Path('docs/home_assistant_compatibility.json').write_text(json.dumps({'tested_version': os.environ['TESTED_VERSION']}, indent=2) + '\\n')"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update tested Home Assistant version"
          branch: automation/tested-home-assistant-version
          title: "chore: update tested Home Assistant version"
          body: "Updates the Home Assistant version verified by the daily compatibility workflow."